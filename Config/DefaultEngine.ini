[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Peregon.PeregonGameMode

[/Script/Engine.RendererSettings]
; Современный свет поверх PSX-геометрии: Lumen, виртуальные тени, объёмный туман.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.VolumetricFog=1
; Чёткая картинка при высоком FPS: без размытия в движении.
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/Engine.PhysicsSettings]
; Сабстепинг физики кузова. Колёса и мотор ядро считает само с шагом 1/600 с.
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=8
; Типы покрытий — читаются подвеской (UPeregonVehicleMovementComponent::Surfaces).
PhysicalSurfaces=(Type=SurfaceType1,Name="Asphalt")
PhysicalSurfaces=(Type=SurfaceType2,Name="Gravel")
PhysicalSurfaces=(Type=SurfaceType3,Name="Dirt")
PhysicalSurfaces=(Type=SurfaceType4,Name="Mud")
PhysicalSurfaces=(Type=SurfaceType5,Name="Snow")
PhysicalSurfaces=(Type=SurfaceType6,Name="Ice")
PhysicalSurfaces=(Type=SurfaceType7,Name="Grass")
PhysicalSurfaces=(Type=SurfaceType8,Name="Sand")

[/Script/Engine.Engine]
bSmoothFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.CollisionProfile]
; Канал «взаимодействие»: ловят его только интерактивные детали (двери, капот, ключ…).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Interact")
