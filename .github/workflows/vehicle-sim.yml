name: Core tests (physics + road generator)

on:
  push:
    paths:
      - "Source/VehicleSimCore/**"
      - "Source/RoadGenCore/**"
      - "Tests/**"
      - ".github/workflows/vehicle-sim.yml"
  pull_request:
    paths:
      - "Source/VehicleSimCore/**"
      - "Source/RoadGenCore/**"
      - "Tests/**"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Configure
        run: cmake -S Tests -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
